<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artist — The House of Dumb S#iT</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="site.css"></head><body><div id="header"></div><main class="wrap"><div id="profile"><p class="muted">Loading artist profile…</p></div></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="shared.js"></script><script>document.querySelector('#header').innerHTML=header('artists');document.querySelector('#footer').innerHTML=footer();async function init(){if(!sb){$('#profile').innerHTML='<div class="notice">Connect Supabase to view artist profiles.</div>';return}const id=new URLSearchParams(location.search).get('id');if(!id){$('#profile').innerHTML='<div class="notice">No artist was selected.</div>';return}const {data:a,error}=await sb.from('artists').select('id,display_name,practice,location,tagline,bio').eq('id',id).eq('published',true).maybeSingle();if(error||!a){$('#profile').innerHTML='<div class="notice">This artist profile is not available.</div>';return}$('#profile').innerHTML=`<div class="eyebrow">${esc(a.practice||'Independent artist')} · ${esc(a.location||'')}</div><h1>${esc(a.display_name)}</h1><p class="lead">${esc(a.tagline||'')}</p><div class="panel"><p style="white-space:pre-wrap;line-height:1.9">${esc(a.bio||'This artist is still shaping their profile.')}</p></div><p class="muted">Interested in exploring a commission with ${esc(a.display_name)}?</p><a class="btn dark" href="patron.html">Sign in as a patron to commission ↗</a><a class="btn" href="artists.html">Back to artists</a>`}init();</script></body></html>
